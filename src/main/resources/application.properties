spring.application.name=rsvp-backend
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}


firebase.serviceAccount=${FIREBASE_SERVICE_ACCOUNT}
firebase.projectId=${FIREBASE_PROJECT_ID}


# ===============================
# Brevo configuration (HTTP API)
# ===============================
brevo.apiKey=${BREVO_API_KEY}
app.mail.from=${MAIL_FROM}
app.mail.fromName=${MAIL_FROM_NAME:Wedding RSVP}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

